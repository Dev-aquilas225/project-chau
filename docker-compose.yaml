services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-aquilas}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-aquilas}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-priscillenkengue94@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-88888888eE@!}
      PORT: 3000
      # Origines autorisées en CORS (liste séparée par des virgules, ex: https://mondomaine.com,https://admin.mondomaine.com).
      # Sans cette variable, le backend retombe sur des origines de dev (localhost) et
      # bloquera les appels du frontend de production — à définir explicitement sur Coolify.
      CORS_ORIGINS: ${CORS_ORIGINS}
      # SMTP (emails transactionnels : bienvenue, commande, statut, décision vendeur).
      # Laissés vides par défaut : le backend journalise sans envoyer tant qu'ils ne
      # sont pas positionnés explicitement sur Coolify.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-no-reply@occasiondeluxepjinternational.com}
      # URL du site client, utilisée dans les liens des emails (bouton "voir ma commande", lien magique, etc.)
      FRONTEND_URL: ${FRONTEND_URL:-https://occasiondeluxepjinternational.com}
    ports:
      - "3000"
    volumes:
      - uploads-data:/app/uploads
    labels:
      - "coolify.managed=true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.occasiondeluxepjinternational.com/api}
    restart: unless-stopped
    ports:
      - "80"
    labels:
      - "coolify.managed=true"

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${ADMIN_VITE_API_URL:-${VITE_API_URL:-https://api.occasiondeluxepjinternational.com/api}}
    restart: unless-stopped
    ports:
      - "80"
    labels:
      - "coolify.managed=true"

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@aquilas.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "80"
    labels:
      - "coolify.managed=true"

volumes:
  pgdata:
  pgadmin-data:
  uploads-data:
